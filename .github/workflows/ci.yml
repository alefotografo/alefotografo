name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Checagens do playbook da rotina de gerência (rotina-monitoramento.md):
      # sitemap acessível, robots com sitemap, 404 real. Falha o job se quebrar.
      - name: Checagens do site (após push no main)
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' https://alefotografo.com.br/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://alefotografo.com.br/robots.txt)" = "200"
          curl -s https://alefotografo.com.br/robots.txt | grep -q "Sitemap:"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://alefotografo.com.br/sitemap-index.xml)" = "200"
          test "$(curl -sL -o /dev/null -w '%{http_code}' https://alefotografo.com.br/url-que-nao-existe-ci)" = "404"
