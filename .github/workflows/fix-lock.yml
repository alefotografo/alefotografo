name: Fix lockfile
on:
  push:
    branches: [fix/lockfile-sync]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerar package-lock
        run: npm install --package-lock-only --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Commit do lock sincronizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "lock já sincronizado" || (git commit -m "chore: sincronizar package-lock com package.json" && git push)
